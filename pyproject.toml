[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerfile-security-checker"
version = "1.0.0"
description = "A small Dockerfile security and quality checker"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
dockercheck = "dockercheck.cli:main"

[tool.setuptools.packages.find]
include = ["dockercheck*"]
