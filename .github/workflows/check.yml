name: Проверки Dockercheck
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m dockercheck Dockerfile examples/good --fail-on warning
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m dockercheck Dockerfile examples/good --format sarif --output reports/dockercheck.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dockercheck-sarif
          path: reports/dockercheck.sarif
      - run: docker build -t dockercheck-test .
      - run: docker run --rm -v "$PWD/examples/good:/examples:ro" dockercheck-test /examples --fail-on warning
